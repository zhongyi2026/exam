<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>手少阴心经小测</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', Roboto, sans-serif;
        }
        body {
            background: #eef4f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .exam-container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,20,0,0.1);
            padding: 28px 32px;
            border: 1px solid #cbdcd0;
        }
        h1 {
            font-size: 1.8rem;
            color: #1c5a3a;
            margin: 0 0 8px 0;
            border-left: 8px solid #3e8e6b;
            padding-left: 20px;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 20px 0;
            color: #2d6a4f;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-indicator {
            background: #d8f0e6;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 1rem;
        }
        .student-row {
            background: #f8fefb;
            border: 1px solid #c0dfcf;
            border-radius: 50px;
            padding: 10px 25px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .student-row label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1c6e4a;
        }
        .student-row input {
            border: 2px solid #c0dfcf;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 1rem;
            width: 170px;
            outline: none;
        }
        .student-row input:focus {
            border-color: #3e8e6b;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #d4e6dc;
            border-radius: 24px;
            padding: 16px 22px;
            margin-bottom: 12px;
            transition: 0.1s;
        }
        .question-card.correct-highlight {
            border-left: 10px solid #2e9c6b;
            background: #f4fbf8;
        }
        .question-card.wrong-highlight {
            border-left: 10px solid #e07c4c;
            background: #fffaf5;
        }
        .q-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1c6e4a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .q-num {
            background: #3e8e6b;
            color: white;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-left: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 35px 0 20px;
        }
        .btn {
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #3e8e6b;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background: #2c6e50;
        }
        .btn-secondary {
            background: #e2ede7;
            color: #2d6a4f;
        }
        .result-panel {
            background: #e6f4ef;
            border-radius: 28px;
            padding: 20px 25px;
            margin: 25px 0 15px;
            border: 1px solid #bdd9cd;
        }
        .score-big {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1c6e4a;
        }
        .remark {
            font-size: 1.3rem;
            margin-left: 12px;
            color: #2d6a4f;
        }
        .mistake-list {
            margin-top: 18px;
            background: #fff2e9;
            border-radius: 24px;
            padding: 14px 20px;
            border-left: 6px solid #e07c4c;
        }
        .mistake-title {
            font-weight: 600;
            color: #b4532a;
            margin-bottom: 8px;
        }
        .mistake-item {
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .answer-key-section {
            margin-top: 30px;
            background: #f4f9f5;
            border-radius: 24px;
            padding: 20px 25px;
            border: 1px solid #c8e0d4;
        }
        .answer-key-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1c6e4a;
            border-left: 6px solid #3e8e6b;
            padding-left: 16px;
            margin-bottom: 16px;
        }
        .answer-item {
            padding: 6px 0;
            border-bottom: 1px dashed #d8e8dc;
            font-size: 0.95rem;
        }
        .answer-item:last-child {
            border-bottom: none;
        }
        .footer {
            text-align: right;
            color: #7ba792;
            margin-top: 12px;
            font-size: 0.8rem;
        }
        @media (max-width: 600px) {
            .exam-container {
                padding: 18px;
            }
            .options {
                gap: 8px 16px;
            }
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📋 手少阴心经小测</h1>
    <div class="subhead">
        <span class="score-indicator">💯 20题 · 每题5分 · 满分100分</span>
    </div>

    <div class="student-row">
        <label>🔢 学号 (1~50):</label>
        <input type="number" id="studentId" min="1" max="50" placeholder="请输入学号" value="">
    </div>

    <div class="quiz-form" id="quizForm"></div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="submitBtn">📥 提交试卷 · 查看成绩</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 重新答题</button>
    </div>

    <div class="result-panel" id="resultPanel" style="display: none;">
        <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;">
            <span class="score-big" id="scoreValue">0</span><span style="font-size:1.4rem;">分</span>
            <span class="remark" id="remarkText"></span>
        </div>
        <div id="mistakeContainer" class="mistake-list" style="display: none;">
            <div class="mistake-title">📌 错题回顾</div>
            <div id="mistakeDetails"></div>
        </div>
        <div style="margin-top: 12px; color: #2d6a4f;" id="scoreMessage"></div>
    </div>

    <div class="answer-key-section">
        <div class="answer-key-title">📖 标准答案与解析</div>
        <div id="answerKeyGrid"></div>
    </div>

    <div class="footer">
        依据：《手少阴心经》资料 | 经络学习自测
    </div>
</div>

<script>
    (function(){
        const questions = [
            { text: "根据西医基础知识，心脏位于人体的哪个位置？", options: ["A. 胸腔两肺之间偏右", "B. 胸腔两肺之间偏左", "C. 腹腔上方偏左", "D. 腹腔上方偏右"], correct: "B", explanation: "心脏位于胸腔两肺之间偏左。" },
            { text: "根据西医基础知识，心脏收缩时，血液被射入哪个系统？", options: ["A. 静脉系统", "B. 淋巴系统", "C. 动脉系统", "D. 消化系统"], correct: "C", explanation: "心脏收缩时将血液射入动脉系统。" },
            { text: "根据西医基础知识，心脏舒张时，血液通过什么途径回流到心脏？", options: ["A. 动脉系统", "B. 静脉系统", "C. 淋巴系统", "D. 呼吸系统"], correct: "B", explanation: "心脏舒张时通过静脉系统使血液回流。" },
            { text: "根据西医基础知识，收缩压是指？", options: ["A. 心室舒张末期动脉压力的最低值", "B. 心室收缩射血时主动脉内压力的最高值", "C. 心脏静止时静脉内的压力", "D. 心房收缩时肺动脉内的压力"], correct: "B", explanation: "收缩压是心室收缩射血时，主动脉（或大动脉）内压力达到的最高值。" },
            { text: "根据西医基础知识，成年人正常脉压差（收缩压与舒张压之差）的范围大约是？", options: ["A. 10-20 mmHg", "B. 20-40 mmHg", "C. 30-50 mmHg", "D. 40-60 mmHg"], correct: "C", explanation: "正常脉压差约30-50 mmHg。" },
            { text: "中医称心为“君主之官”，其含义是？", options: ["A. 心主运化水谷", "B. 心为五脏六腑之大主", "C. 心主统摄血液", "D. 心主疏泄气机"], correct: "B", explanation: "心为君主之官，为五脏六腑之大主。" },
            { text: "中医理论中，心主神明，主要是指心主管人体的什么？", options: ["A. 呼吸运动", "B. 消化吸收", "C. 精神、思维活动", "D. 水液代谢"], correct: "C", explanation: "心主神明，主司人的精神、思维。" },
            { text: "根据中医理论，心在五行中的属性及与哪个脏腑相表里？", options: ["A. 五行属木，与胆相表里", "B. 五行属火，与小肠相表里", "C. 五行属土，与胃相表里", "D. 五行属金，与大肠相表里"], correct: "B", explanation: "心五行属火，与小肠相表里。" },
            { text: "手少阴心经的当令时间是？", options: ["A. 巳时（9-11点）", "B. 午时（11-13点）", "C. 未时（13-15点）", "D. 申时（15-17点）"], correct: "B", explanation: "心经当令于午时（11-13点）。" },
            { text: "手少阴心经的体表支，起于腋窝顶端的哪个穴位？", options: ["A. 极泉", "B. 少海", "C. 青灵", "D. 少冲"], correct: "A", explanation: "体表支起于腋窝顶端的极泉穴。" },
            { text: "手少阴心经体表支的循行终点是哪个穴位？", options: ["A. 少府", "B. 神门", "C. 少冲", "D. 通里"], correct: "C", explanation: "体表支止于小指内侧的少冲穴。" },
            { text: "位于腋窝中间，腋动脉旁，主治胸闷、心痛、上肢不举或麻木的穴位是？", options: ["A. 少海", "B. 极泉", "C. 青灵", "D. 通里"], correct: "B", explanation: "极泉位于腋窝中间，腋动脉旁。" },
            { text: "位于屈肘内侧横纹点与肱骨内上髁连线中点处，主治心绞痛、头痛、眩晕、臂肘痛的穴位是？", options: ["A. 少海", "B. 通里", "C. 神门", "D. 少府"], correct: "A", explanation: "少海位于屈肘内侧横纹点与肱骨内上髁连线中点处。" },
            { text: "腕部四穴（神门、通里、阴郄、灵道）均位于腕横纹附近，它们的分布范围大约在腕横纹上多少寸之内？", options: ["A. 0.5寸", "B. 1.0寸", "C. 1.5寸", "D. 2.0寸"], correct: "C", explanation: "腕部四穴分布在腕横纹上1.5寸范围内。" },
            { text: "位于腕横纹上1寸，尺侧腕屈肌腱桡侧，主治暴暗、失眠、尺神经麻痹的穴位是？", options: ["A. 神门", "B. 通里", "C. 少府", "D. 少冲"], correct: "B", explanation: "通里在腕横纹上1寸，主治暴暗、失眠。" },
            { text: "被称为心经“原穴”，位于腕横纹上、尺侧腕屈肌腱桡侧，主治心烦心悸、失眠多梦的穴位是？", options: ["A. 通里", "B. 神门", "C. 少府", "D. 少冲"], correct: "B", explanation: "神门为心经原穴，主治心烦心悸、失眠多梦。" },
            { text: "神门穴是心经的什么特定穴？", options: ["A. 络穴", "B. 郄穴", "C. 原穴", "D. 合穴"], correct: "C", explanation: "神门是心经原穴。" },
            { text: "位于手掌面，第4、5掌骨间，握拳时小指尖所指处，主治心烦不眠、手掌心热的穴位是？", options: ["A. 神门", "B. 通里", "C. 少府", "D. 少冲"], correct: "C", explanation: "少府位于手掌面第4、5掌骨间。" },
            { text: "位于小指指甲轮桡侧角后，主治心悸、心痛、咽喉肿痛、昏迷的穴位是？", options: ["A. 少冲", "B. 少府", "C. 神门", "D. 通里"], correct: "A", explanation: "少冲位于小指指甲轮桡侧角后。" },
            { text: "现在很多人睡眠不好，心经中哪个穴位最常用于调理失眠多梦？", options: ["A. 极泉", "B. 少海", "C. 神门", "D. 少冲"], correct: "C", explanation: "神门最常用于调理失眠多梦。" }
        ];

        const correctAnswers = questions.map(q => q.correct);
        let userSelections = new Array(questions.length).fill(null);
        let submitted = false;

        const quizForm = document.getElementById('quizForm');
        const resultPanel = document.getElementById('resultPanel');
        const scoreValue = document.getElementById('scoreValue');
        const remarkText = document.getElementById('remarkText');
        const mistakeContainer = document.getElementById('mistakeContainer');
        const mistakeDetails = document.getElementById('mistakeDetails');
        const scoreMessage = document.getElementById('scoreMessage');
        const studentIdInput = document.getElementById('studentId');
        const answerGrid = document.getElementById('answerKeyGrid');

        function renderAnswerKey() {
            let html = '';
            questions.forEach((q, idx) => {
                html += `<div class="answer-item"><strong>${idx+1}.</strong> 正确答案：<strong>${q.correct}</strong> — ${q.explanation}</div>`;
            });
            answerGrid.innerHTML = html;
        }

        function renderQuestions() {
            let html = '';
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                const saved = userSelections[i];
                html += `<div class="question-card" id="qCard${i}">`;
                html += `<div class="q-title"><span class="q-num">${i+1}</span> ${q.text}</div>`;
                html += `<div class="options">`;
                q.options.forEach(opt => {
                    const val = opt[0];
                    const checked = (saved === val) ? 'checked' : '';
                    html += `<label class="option-item"><input type="radio" name="q${i}" value="${val}" ${checked}> ${opt}</label>`;
                });
                html += `</div></div>`;
            }
            quizForm.innerHTML = html;
            for (let i = 0; i < questions.length; i++) {
                const radios = document.getElementsByName(`q${i}`);
                radios.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        userSelections[i] = e.target.value;
                        if (submitted) {
                            submitted = false;
                            resultPanel.style.display = 'none';
                            removeHighlights();
                        }
                    });
                });
            }
        }

        function removeHighlights() {
            for (let i = 0; i < questions.length; i++) {
                const card = document.getElementById(`qCard${i}`);
                if (card) card.classList.remove('correct-highlight', 'wrong-highlight');
            }
        }

        function applyHighlights() {
            for (let i = 0; i < questions.length; i++) {
                const card = document.getElementById(`qCard${i}`);
                if (!card) continue;
                const selected = userSelections[i];
                const correct = correctAnswers[i];
                card.classList.remove('correct-highlight', 'wrong-highlight');
                if (selected) {
                    if (selected === correct) card.classList.add('correct-highlight');
                    else card.classList.add('wrong-highlight');
                }
            }
        }

        function computeScore() {
            let correctCount = 0;
            const mistakes = [];
            for (let i = 0; i < questions.length; i++) {
                const selected = userSelections[i];
                if (selected && selected === correctAnswers[i]) correctCount++;
                else mistakes.push(i+1);
            }
            return { correctCount, mistakes };
        }

        function showResult() {
            const { correctCount, mistakes } = computeScore();
            const totalScore = correctCount * 5;
            let studentId = studentIdInput.value.trim();
            if (studentId === '' || isNaN(parseInt(studentId)) || parseInt(studentId) < 1 || parseInt(studentId) > 50) studentId = '未填/无效';

            scoreValue.innerText = totalScore;
            let remark = '';
            if (totalScore >= 90) remark = '优秀 🌟';
            else if (totalScore >= 80) remark = '良好 👍';
            else if (totalScore >= 60) remark = '及格 📚';
            else remark = '需复习 🕒';
            remarkText.innerText = remark;

            if (mistakes.length > 0) {
                mistakeContainer.style.display = 'block';
                let html = '';
                mistakes.forEach(qNo => { html += `<div class="mistake-item">❌ 第 ${qNo} 题</div>`; });
                mistakeDetails.innerHTML = html;
            } else {
                mistakeContainer.style.display = 'none';
            }
            scoreMessage.innerText = `学号 ${studentId}  答对 ${correctCount} 题，总分 ${totalScore} 分。${mistakes.length ? '错题已用橙色高亮' : '太棒了，全对！'}`;
            applyHighlights();
            resultPanel.style.display = 'block';
            submitted = true;
        }

        function resetExam() {
            userSelections.fill(null);
            for (let i = 0; i < questions.length; i++) {
                const radios = document.getElementsByName(`q${i}`);
                radios.forEach(r => r.checked = false);
            }
            resultPanel.style.display = 'none';
            submitted = false;
            removeHighlights();
            studentIdInput.value = '';
        }

        renderAnswerKey();
        renderQuestions();

        document.getElementById('submitBtn').addEventListener('click', () => {
            let sid = studentIdInput.value;
            if (!sid || parseInt(sid) < 1 || parseInt(sid) > 50) alert('请填写正确的学号 (1-50)');
            const missing = [];
            for (let i = 0; i < questions.length; i++) if (!userSelections[i]) missing.push(i+1);
            if (missing.length && !confirm(`第 ${missing.join(', ')} 题未选，未选视为错误。确定提交吗？`)) return;
            showResult();
        });
        document.getElementById('resetBtn').addEventListener('click', resetExam);
        resultPanel.style.display = 'none';
    })();
</script>
</body>
</html>
