<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>手太阳小肠经小测</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', Roboto, sans-serif;
        }
        body {
            background: #eef4f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .exam-container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,20,0,0.1);
            padding: 28px 32px;
            border: 1px solid #cbdcd0;
        }
        h1 {
            font-size: 1.8rem;
            color: #1c5a3a;
            margin: 0 0 8px 0;
            border-left: 8px solid #3e8e6b;
            padding-left: 20px;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 20px 0;
            color: #2d6a4f;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-indicator {
            background: #d8f0e6;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 1rem;
        }
        .student-row {
            background: #f8fefb;
            border: 1px solid #c0dfcf;
            border-radius: 50px;
            padding: 10px 25px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .student-row label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1c6e4a;
        }
        .student-row input {
            border: 2px solid #c0dfcf;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 1rem;
            width: 170px;
            outline: none;
        }
        .student-row input:focus {
            border-color: #3e8e6b;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #d4e6dc;
            border-radius: 24px;
            padding: 16px 22px;
            margin-bottom: 12px;
            transition: 0.1s;
        }
        .question-card.correct-highlight {
            border-left: 10px solid #2e9c6b;
            background: #f4fbf8;
        }
        .question-card.wrong-highlight {
            border-left: 10px solid #e07c4c;
            background: #fffaf5;
        }
        .q-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1c6e4a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .q-num {
            background: #3e8e6b;
            color: white;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-left: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 35px 0 20px;
        }
        .btn {
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #3e8e6b;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-primary:hover {
            background: #2c6e50;
        }
        .btn-secondary {
            background: #e2ede7;
            color: #2d6a4f;
        }
        .result-panel {
            background: #e6f4ef;
            border-radius: 28px;
            padding: 20px 25px;
            margin: 25px 0 15px;
            border: 1px solid #bdd9cd;
        }
        .score-big {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1c6e4a;
        }
        .remark {
            font-size: 1.3rem;
            margin-left: 12px;
            color: #2d6a4f;
        }
        .mistake-list {
            margin-top: 18px;
            background: #fff2e9;
            border-radius: 24px;
            padding: 14px 20px;
            border-left: 6px solid #e07c4c;
        }
        .mistake-title {
            font-weight: 600;
            color: #b4532a;
            margin-bottom: 8px;
        }
        .mistake-item {
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .answer-key-section {
            margin-top: 30px;
            background: #f4f9f5;
            border-radius: 24px;
            padding: 20px 25px;
            border: 1px solid #c8e0d4;
        }
        .answer-key-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1c6e4a;
            border-left: 6px solid #3e8e6b;
            padding-left: 16px;
            margin-bottom: 16px;
        }
        .answer-item {
            padding: 6px 0;
            border-bottom: 1px dashed #d8e8dc;
            font-size: 0.95rem;
        }
        .answer-item:last-child {
            border-bottom: none;
        }
        .footer {
            text-align: right;
            color: #7ba792;
            margin-top: 12px;
            font-size: 0.8rem;
        }
        @media (max-width: 600px) {
            .exam-container {
                padding: 18px;
            }
            .options {
                gap: 8px 16px;
            }
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📋 手太阳小肠经小测</h1>
    <div class="subhead">
        <span class="score-indicator">💯 20题 · 每题5分 · 满分100分</span>
    </div>

    <div class="student-row">
        <label>🔢 学号 (1~50):</label>
        <input type="number" id="studentId" min="1" max="50" placeholder="请输入学号" value="">
    </div>

    <div class="quiz-form" id="quizForm"></div>

    <div class="action-buttons">
        <button class="btn btn-primary" id="submitBtn">📥 提交试卷 · 查看成绩</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 重新答题</button>
    </div>

    <div class="result-panel" id="resultPanel" style="display: none;">
        <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;">
            <span class="score-big" id="scoreValue">0</span><span style="font-size:1.4rem;">分</span>
            <span class="remark" id="remarkText"></span>
        </div>
        <div id="mistakeContainer" class="mistake-list" style="display: none;">
            <div class="mistake-title">📌 错题回顾</div>
            <div id="mistakeDetails"></div>
        </div>
        <div style="margin-top: 12px; color: #2d6a4f;" id="scoreMessage"></div>
    </div>

    <div class="answer-key-section">
        <div class="answer-key-title">📖 标准答案与解析</div>
        <div id="answerKeyGrid"></div>
    </div>

    <div class="footer">
        依据：《手太阳小肠经》资料 | 经络学习自测
    </div>
</div>

<script>
    (function(){
        const questions = [
            { text: "根据西医基础知识，小肠位于人体的哪个位置？", options: ["A. 胸腔内", "B. 腹腔内", "C. 盆腔内", "D. 纵隔内"], correct: "B", explanation: "小肠位于腹腔内，上接胃的幽门，下连大肠的回盲部。" },
            { text: "根据西医基础知识，小肠的全长约是多少？", options: ["A. 3米", "B. 4米", "C. 6米", "D. 5米"], correct: "C", explanation: "小肠全长约6米。" },
            { text: "根据西医基础知识，小肠上接胃的幽门，下连大肠的哪个部位？", options: ["A. 升结肠", "B. 回盲部", "C. 乙状结肠", "D. 直肠"], correct: "B", explanation: "小肠下连大肠的回盲部。" },
            { text: "中医理论中，小肠的主要功能是？", options: ["A. 主运化、主统血", "B. 主气、司呼吸", "C. 主受盛、化物", "D. 主疏泄、主藏血"], correct: "C", explanation: "小肠主受盛、化物，泌别清浊。" },
            { text: "中医理论中，“小肠泌别清浊”的含义是？", options: ["A. 小肠分泌消化液", "B. 小肠排出胆汁", "C. 小肠生成气血", "D. 小肠将水谷精微与糟粕分开"], correct: "D", explanation: "泌别清浊，即将水谷精微与糟粕分开。" },
            { text: "根据中医理论，小肠与哪个脏腑相表里？", options: ["A. 肺", "B. 脾", "C. 心", "D. 肝"], correct: "C", explanation: "小肠为六腑之一，与心相表里。" },
            { text: "手太阳小肠经的当令时间是？", options: ["A. 午时（11-13点）", "B. 申时（15-17点）", "C. 酉时（17-19点）", "D. 未时（13-15点）"], correct: "D", explanation: "小肠经当令于未时（13-15点）。" },
            { text: "手太阳小肠经的循行起点是哪个穴位？", options: ["A. 后溪", "B. 腕骨", "C. 听宫", "D. 少泽"], correct: "D", explanation: "小肠经起于小指尺侧指甲旁的少泽穴。" },
            { text: "手太阳小肠经体表支的循行终点，与哪条经脉对接？", options: ["A. 足太阳膀胱经", "B. 足阳明胃经", "C. 足少阳胆经", "D. 手阳明大肠经"], correct: "A", explanation: "体表支上行至眼内眦，与足太阳膀胱经对接。" },
            { text: "手太阳小肠经单侧共有多少个穴位？", options: ["A. 17个", "B. 19个", "C. 18个", "D. 20个"], correct: "B", explanation: "手太阳小肠经单侧共19个穴位。" },
            { text: "位于小指指甲轮尺侧角后，主治热病、耳鸣耳聋、产后乳少的穴位是？", options: ["A. 后溪", "B. 少泽", "C. 腕骨", "D. 养老"], correct: "B", explanation: "少泽位于小指指甲轮尺侧角后，主治热病、耳鸣耳聋、产后乳少。" },
            { text: "位于肩关节后下方，腋后纹头上1寸，主治肩周炎、上肢活动功能障碍的穴位是？", options: ["A. 天宗", "B. 小海", "C. 肩贞", "D. 养老"], correct: "C", explanation: "肩贞位于肩关节后下方，腋后纹头上1寸。" },
            { text: "位于小指第5掌指关节后的手掌横纹头赤白肉际处，主治头项强痛、腰痛的穴位是？", options: ["A. 少泽", "B. 腕骨", "C. 后溪", "D. 养老"], correct: "C", explanation: "后溪位于小指第5掌指关节后的手掌横纹头赤白肉际处。" },
            { text: "后溪穴的调理作用不包括以下哪项？", options: ["A. 头项强痛", "B. 产后乳少", "C. 耳聋目眩", "D. 腰痛"], correct: "B", explanation: "产后乳少是少泽的主治，不是后溪。" },
            { text: "被称为小肠经“原穴”，位于第5掌骨基底与钩骨之间凹陷处的穴位是？", options: ["A. 后溪", "B. 腕骨", "C. 养老", "D. 小海"], correct: "B", explanation: "腕骨为小肠经原穴，位于第5掌骨基底与钩骨之间凹陷处。" },
            { text: "位于前臂背面尺侧，尺骨头近心端桡侧凹陷中，主治眼花耳聋、腰酸背痛的穴位是？", options: ["A. 腕骨", "B. 小海", "C. 养老", "D. 肩贞"], correct: "C", explanation: "养老位于前臂背面尺侧，尺骨头近心端桡侧凹陷中。" },
            { text: "位于肘内侧，尺骨鹰嘴与肱骨内上髁之间凹陷处，主治精神疾病、手臂麻木疼痛的穴位是？", options: ["A. 养老", "B. 小海", "C. 肩贞", "D. 天宗"], correct: "B", explanation: "小海位于肘内侧，尺骨鹰嘴与肱骨内上髁之间凹陷处。" },
            { text: "位于肩胛部冈下窝中央凹陷处，与第四胸椎相平，主治肩、颈、心肺及乳腺疾病的穴位是？", options: ["A. 肩贞", "B. 听宫", "C. 天宗", "D. 小海"], correct: "C", explanation: "天宗位于肩胛部冈下窝中央凹陷处，与第四胸椎相平。" },
            { text: "位于耳屏与颞下颌关节之间，张口时呈凹陷处，主治耳鸣、耳聋、牙痛的穴位是？", options: ["A. 听宫", "B. 天宗", "C. 肩贞", "D. 养老"], correct: "A", explanation: "听宫位于耳屏与颞下颌关节之间，张口时呈凹陷处。" },
            { text: "听宫穴的取穴特点是？", options: ["A. 闭口取穴", "B. 咬牙取穴", "C. 张口取穴", "D. 鼓腮取穴"], correct: "C", explanation: "听宫穴需张口取穴，张口时呈凹陷处。" }
        ];

        const correctAnswers = questions.map(q => q.correct);
        let userSelections = new Array(questions.length).fill(null);
        let submitted = false;

        const quizForm = document.getElementById('quizForm');
        const resultPanel = document.getElementById('resultPanel');
        const scoreValue = document.getElementById('scoreValue');
        const remarkText = document.getElementById('remarkText');
        const mistakeContainer = document.getElementById('mistakeContainer');
        const mistakeDetails = document.getElementById('mistakeDetails');
        const scoreMessage = document.getElementById('scoreMessage');
        const studentIdInput = document.getElementById('studentId');
        const answerGrid = document.getElementById('answerKeyGrid');

        function renderAnswerKey() {
            let html = '';
            questions.forEach((q, idx) => {
                html += `<div class="answer-item"><strong>${idx+1}.</strong> 正确答案：<strong>${q.correct}</strong> — ${q.explanation}</div>`;
            });
            answerGrid.innerHTML = html;
        }

        function renderQuestions() {
            let html = '';
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                const saved = userSelections[i];
                html += `<div class="question-card" id="qCard${i}">`;
                html += `<div class="q-title"><span class="q-num">${i+1}</span> ${q.text}</div>`;
                html += `<div class="options">`;
                q.options.forEach(opt => {
                    const val = opt[0];
                    const checked = (saved === val) ? 'checked' : '';
                    html += `<label class="option-item"><input type="radio" name="q${i}" value="${val}" ${checked}> ${opt}</label>`;
                });
                html += `</div></div>`;
            }
            quizForm.innerHTML = html;
            for (let i = 0; i < questions.length; i++) {
                const radios = document.getElementsByName(`q${i}`);
                radios.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        userSelections[i] = e.target.value;
                        if (submitted) {
                            submitted = false;
                            resultPanel.style.display = 'none';
                            removeHighlights();
                        }
                    });
                });
            }
        }

        function removeHighlights() {
            for (let i = 0; i < questions.length; i++) {
                const card = document.getElementById(`qCard${i}`);
                if (card) card.classList.remove('correct-highlight', 'wrong-highlight');
            }
        }

        function applyHighlights() {
            for (let i = 0; i < questions.length; i++) {
                const card = document.getElementById(`qCard${i}`);
                if (!card) continue;
                const selected = userSelections[i];
                const correct = correctAnswers[i];
                card.classList.remove('correct-highlight', 'wrong-highlight');
                if (selected) {
                    if (selected === correct) card.classList.add('correct-highlight');
                    else card.classList.add('wrong-highlight');
                }
            }
        }

        function computeScore() {
            let correctCount = 0;
            const mistakes = [];
            for (let i = 0; i < questions.length; i++) {
                const selected = userSelections[i];
                if (selected && selected === correctAnswers[i]) correctCount++;
                else mistakes.push(i+1);
            }
            return { correctCount, mistakes };
        }

        function showResult() {
            const { correctCount, mistakes } = computeScore();
            const totalScore = correctCount * 5;
            let studentId = studentIdInput.value.trim();
            if (studentId === '' || isNaN(parseInt(studentId)) || parseInt(studentId) < 1 || parseInt(studentId) > 50) studentId = '未填/无效';

            scoreValue.innerText = totalScore;
            let remark = '';
            if (totalScore >= 90) remark = '优秀 🌟';
            else if (totalScore >= 80) remark = '良好 👍';
            else if (totalScore >= 60) remark = '及格 📚';
            else remark = '需复习 🕒';
            remarkText.innerText = remark;

            if (mistakes.length > 0) {
                mistakeContainer.style.display = 'block';
                let html = '';
                mistakes.forEach(qNo => { html += `<div class="mistake-item">❌ 第 ${qNo} 题</div>`; });
                mistakeDetails.innerHTML = html;
            } else {
                mistakeContainer.style.display = 'none';
            }
            scoreMessage.innerText = `学号 ${studentId}  答对 ${correctCount} 题，总分 ${totalScore} 分。${mistakes.length ? '错题已用橙色高亮' : '太棒了，全对！'}`;
            applyHighlights();
            resultPanel.style.display = 'block';
            submitted = true;
        }

        function resetExam() {
            userSelections.fill(null);
            for (let i = 0; i < questions.length; i++) {
                const radios = document.getElementsByName(`q${i}`);
                radios.forEach(r => r.checked = false);
            }
            resultPanel.style.display = 'none';
            submitted = false;
            removeHighlights();
            studentIdInput.value = '';
        }

        renderAnswerKey();
        renderQuestions();

        document.getElementById('submitBtn').addEventListener('click', () => {
            let sid = studentIdInput.value;
            if (!sid || parseInt(sid) < 1 || parseInt(sid) > 50) alert('请填写正确的学号 (1-50)');
            const missing = [];
            for (let i = 0; i < questions.length; i++) if (!userSelections[i]) missing.push(i+1);
            if (missing.length && !confirm(`第 ${missing.join(', ')} 题未选，未选视为错误。确定提交吗？`)) return;
            showResult();
        });
        document.getElementById('resetBtn').addEventListener('click', resetExam);
        resultPanel.style.display = 'none';
    })();
</script>
</body>
</html>
