<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>足阳明胃经自测卷</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', '微软雅黑', Roboto, sans-serif;
        }
        body {
            background: #eef4f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .exam-container {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,20,0,0.1);
            padding: 28px 32px;
            border: 1px solid #cbdcd0;
        }
        h1 {
            font-size: 1.9rem;
            color: #1c5a3a;
            margin: 0 0 8px 0;
            border-left: 8px solid #3e8e6b;
            padding-left: 20px;
        }
        .subhead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0 20px 0;
            color: #2d6a4f;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-indicator {
            background: #d8f0e6;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 1rem;
        }
        .student-row {
            background: #f8fefb;
            border: 1px solid #c0dfcf;
            border-radius: 50px;
            padding: 10px 25px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .student-row label {
            font-size: 1.1rem;
            font-weight: 500;
            color: #1c6e4a;
        }
        .student-row input {
            border: 2px solid #c0dfcf;
            border-radius: 40px;
            padding: 10px 18px;
            font-size: 1rem;
            width: 170px;
            outline: none;
        }
        .question-card {
            background: #ffffff;
            border: 1px solid #d4e6dc;
            border-radius: 24px;
            padding: 16px 22px;
            margin-bottom: 12px;
            transition: 0.1s;
        }
        .question-card.correct-highlight {
            border-left: 10px solid #2e9c6b;
            background: #f4fbf8;
        }
        .question-card.wrong-highlight {
            border-left: 10px solid #e07c4c;
            background: #fffaf5;
        }
        .q-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1c6e4a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .q-num {
            background: #3e8e6b;
            color: white;
            border-radius: 30px;
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 28px;
            margin-left: 12px;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 35px 0 20px;
        }
        .btn {
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-primary {
            background: #3e8e6b;
            color: white;
        }
        .btn-secondary {
            background: #e2ede7;
            color: #2d6a4f;
        }
        .result-panel {
            background: #e6f4ef;
            border-radius: 28px;
            padding: 20px 25px;
            margin: 25px 0 15px;
        }
        .score-big {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1c6e4a;
        }
        .mistake-list {
            margin-top: 18px;
            background: #fff2e9;
            border-radius: 24px;
            padding: 14px 20px;
            border-left: 6px solid #e07c4c;
        }
        .answer-key {
            margin-top: 30px;
            background: #f4f9f5;
            border-radius: 28px;
            padding: 20px 25px;
        }
        .answer-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1c6e4a;
            border-left: 6px solid #3e8e6b;
            padding-left: 16px;
            margin-bottom: 16px;
        }
        .answer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .answer-item {
            background: white;
            border-radius: 20px;
            padding: 10px 16px;
            border: 1px solid #d4e6dc;
            font-size: 0.9rem;
        }
        .footer {
            text-align: right;
            color: #7ba792;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="exam-container">
    <h1>📋 足阳明胃经·自测卷</h1>
    <div class="subhead">
        <span class="score-indicator">20题 · 每题5分 · 满分100分</span>
    </div>
    <div class="student-row">
        <label>🔢 学号 (1~50):</label>
        <input type="number" id="studentId" min="1" max="50" placeholder="请输入学号" value="">
    </div>
    <div class="quiz-form" id="quizForm"></div>
    <div class="action-buttons">
        <button class="btn btn-primary" id="submitBtn">📥 提交试卷 · 查看成绩</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 重新答题</button>
    </div>
    <div class="result-panel" id="resultPanel" style="display: none;">
        <div><span class="score-big" id="scoreValue">0</span><span style="font-size:1.4rem;">分</span> <span id="remarkText"></span></div>
        <div id="mistakeContainer" class="mistake-list" style="display: none;">
            <div class="mistake-title">📌 错题回顾</div>
            <div id="mistakeDetails"></div>
        </div>
        <div id="scoreMessage"></div>
    </div>
    <div class="answer-key" id="answerKey">
        <div class="answer-title">📖 标准答案与解析</div>
        <div class="answer-grid" id="answerGrid"></div>
    </div>
    <div class="footer">依据：《足阳明胃经》资料 | 经络学习自测</div>
</div>
<script>
    const questions = [
        { text: "根据西医基础知识，胃主要通过分泌什么物质对食物进行消化？", options: ["A. 胆汁和胰岛素", "B. 胃酸和胃蛋白酶", "C. 唾液和淀粉酶", "D. 肠液和胰蛋白酶"], correct: "B", explanation: "胃分泌胃酸和胃蛋白酶，对食物进行化学性消化。" },
        { text: "胃强大的胃粘膜屏障，主要作用是？", options: ["A. 促进营养吸收", "B. 分泌消化酶", "C. 保护自身不被腐蚀", "D. 储存维生素"], correct: "C", explanation: "胃粘膜屏障可防止胃酸和胃蛋白酶腐蚀胃壁自身。" },
        { text: "胃接受并储存、搅拌、研磨食物后，将食糜推送至哪个器官？", options: ["A. 大肠", "B. 十二指肠", "C. 小肠", "D. 食道"], correct: "C", explanation: "胃将食糜推送至小肠（十二指肠），进行进一步消化吸收。" },
        { text: "中医称胃为“仓廪之官”，其主要功能是？", options: ["A. 分清泌浊", "B. 受纳和腐熟水谷", "C. 主运化水湿", "D. 主疏泄气机"], correct: "B", explanation: "胃主受纳和腐熟水谷，是人体气血生化之源。" },
        { text: "足阳明胃经的当令时间是？", options: ["A. 寅时（3-5点）", "B. 卯时（5-7点）", "C. 辰时（7-9点）", "D. 巳时（9-11点）"], correct: "C", explanation: "胃经当令于辰时（7-9点），此时宜进食早餐。" },
        { text: "“胃以降为和”的含义是指胃气具有什么特性？", options: ["A. 向上发散", "B. 向下通降", "C. 向外布散", "D. 向内收敛"], correct: "B", explanation: "胃气以向下通降为顺，上逆则出现恶心、嗳气等症状。" },
        { text: "足阳明胃经单侧共有多少个穴位？", options: ["A. 42个", "B. 43个", "C. 44个", "D. 45个"], correct: "D", explanation: "足阳明胃经单侧共有45个穴位。" },
        { text: "足阳明胃经体表支的循行终点是哪个穴位？", options: ["A. 厉兑", "B. 内庭", "C. 陷谷", "D. 冲阳"], correct: "A", explanation: "胃经体表支的终点是足第二趾外侧的厉兑穴。" },
        { text: "位于面部，瞳孔直下，眶下孔凹陷处，主治眼病、面瘫的穴位是？", options: ["A. 承泣", "B. 四白", "C. 巨髎", "D. 地仓"], correct: "B", explanation: "四白穴在瞳孔直下，眶下孔凹陷处，主治眼病、面瘫。" },
        { text: "位于下颌角前上方，咬肌中，常用于治疗下牙痛、面瘫的穴位是？", options: ["A. 下关", "B. 颊车", "C. 地仓", "D. 头维"], correct: "B", explanation: "颊车穴在下颌角前上方，咬肌中，为治下牙痛、面瘫要穴。" },
        { text: "以下关于下关穴取穴方法的描述，正确的是？", options: ["A. 需要张口取穴", "B. 需要闭口取穴", "C. 需要咬牙取穴", "D. 需要鼓腮取穴"], correct: "B", explanation: "下关穴在闭口时凹陷明显，张口时消失，故需闭口取穴。" },
        { text: "位于额角发际，主治偏头痛、面肌痉挛的穴位是？", options: ["A. 头维", "B. 本神", "C. 阳白", "D. 攒竹"], correct: "A", explanation: "头维穴在额角发际，主治偏头痛、面肌痉挛、目疾。" },
        { text: "位于锁骨上窝中央，主治喘咳、咽喉肿痛的穴位是？", options: ["A. 梁门", "B. 天枢", "C. 缺盆", "D. 气舍"], correct: "C", explanation: "缺盆穴在锁骨上窝中央，主治喘咳、咽喉肿痛。" },
        { text: "位于脐旁2寸，是治疗便秘、腹泻、腹痛的要穴是？", options: ["A. 梁门", "B. 天枢", "C. 大横", "D. 气海"], correct: "B", explanation: "天枢穴在脐旁2寸，为大肠募穴，治便秘、腹泻、腹痛。" },
        { text: "位于大腿前面，髌底外侧端上2寸，主治急性胃痛、膝关节痛的穴位是？", options: ["A. 血海", "B. 梁丘", "C. 伏兔", "D. 阴市"], correct: "B", explanation: "梁丘穴在髌底外侧端上2寸，为胃经郄穴，善治急性胃痛。" },
        { text: "位于犊鼻下3寸，距胫骨前缘一横指，主治胃肠病症、高血压、神经衰弱的穴位是？", options: ["A. 上巨虚", "B. 下巨虚", "C. 条口", "D. 足三里"], correct: "D", explanation: "足三里在犊鼻下3寸，是胃经合穴，主治胃肠病、高血压、神经衰弱。" },
        { text: "足三里穴是胃经的什么特定穴？", options: ["A. 原穴", "B. 络穴", "C. 合穴", "D. 郄穴"], correct: "C", explanation: "足三里是胃经的合穴，也是下合穴。" },
        { text: "位于外踝尖上8寸，外膝眼与外踝尖连线中点，主治各种痰证、哮喘的穴位是？", options: ["A. 丰隆", "B. 解溪", "C. 条口", "D. 上巨虚"], correct: "A", explanation: "丰隆穴是胃经络穴，为化痰要穴，治各种痰证、哮喘。" },
        { text: "位于足背第2、3趾间，趾蹼缘后方赤白肉际处，主治胃肠热病、牙痛的穴位是？", options: ["A. 厉兑", "B. 内庭", "C. 陷谷", "D. 冲阳"], correct: "B", explanation: "内庭穴在足背2、3趾间，为胃经荥穴，善清胃火，治胃肠热病、牙痛。" },
        { text: "内庭穴常与哪个穴位配伍，以增强清泻胃火的作用？", options: ["A. 足三里", "B. 丰隆", "C. 合谷", "D. 曲池"], correct: "C", explanation: "内庭为胃经荥穴，合谷为大肠经原穴，两穴合用可增强清泻胃火之力。" }
    ];
    let answers = new Array(20).fill(null), submitted = false;
    const correct = questions.map(q => q.correct);
    const container = document.getElementById('quizForm');
    const resultPanel = document.getElementById('resultPanel');
    const scoreSpan = document.getElementById('scoreValue');
    const remarkSpan = document.getElementById('remarkText');
    const mistakeDiv = document.getElementById('mistakeContainer');
    const mistakeDetails = document.getElementById('mistakeDetails');
    const messageDiv = document.getElementById('scoreMessage');
    const studentInput = document.getElementById('studentId');
    const answerGrid = document.getElementById('answerGrid');

    function render() {
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const saved = answers[i];
            html += `<div class="question-card" id="qCard${i}"><div class="q-title"><span class="q-num">${i+1}</span> ${q.text}</div><div class="options">`;
            q.options.forEach(opt => {
                const val = opt[0];
                html += `<label class="option-item"><input type="radio" name="q${i}" value="${val}" ${saved === val ? 'checked' : ''}> ${opt}</label>`;
            });
            html += `</div></div>`;
        }
        container.innerHTML = html;
        for (let i = 0; i < 20; i++) {
            const radios = document.getElementsByName(`q${i}`);
            radios.forEach(r => r.onchange = () => { answers[i] = r.value; if (submitted) { resultPanel.style.display = 'none'; submitted = false; removeHighlights(); } });
        }
    }
    function removeHighlights() { for (let i = 0; i < 20; i++) document.getElementById(`qCard${i}`)?.classList.remove('correct-highlight', 'wrong-highlight'); }
    function applyHighlights() { for (let i = 0; i < 20; i++) { const c = document.getElementById(`qCard${i}`); if (!c) continue; c.classList.remove('correct-highlight', 'wrong-highlight'); if (answers[i]) c.classList.add(answers[i] === correct[i] ? 'correct-highlight' : 'wrong-highlight'); } }
    function computeScore() { let c = 0, m = []; for (let i = 0; i < 20; i++) if (answers[i] === correct[i]) c++; else m.push(i+1); return { correct: c, mistakes: m }; }
    function showResult() {
        const { correct: c, mistakes: m } = computeScore();
        const total = c * 5;
        let sid = studentInput.value.trim();
        if (!sid || sid < 1 || sid > 50) sid = '未填';
        scoreSpan.innerText = total;
        let remark = total >= 90 ? '优秀 🌟' : (total >= 80 ? '良好 👍' : (total >= 60 ? '及格 📚' : '需复习 🕒'));
        remarkSpan.innerText = remark;
        if (m.length) {
            mistakeDiv.style.display = 'block';
            mistakeDetails.innerHTML = m.map(n => `<div class="mistake-item">❌ 第 ${n} 题</div>`).join('');
        } else mistakeDiv.style.display = 'none';
        messageDiv.innerText = `学号 ${sid}  答对 ${c} 题，总分 ${total} 分。${m.length ? '错题已用橙色高亮' : '太棒了，全对！'}`;
        applyHighlights();
        resultPanel.style.display = 'block';
        submitted = true;
    }
    function reset() {
        answers.fill(null);
        for (let i = 0; i < 20; i++) document.getElementsByName(`q${i}`).forEach(r => r.checked = false);
        resultPanel.style.display = 'none';
        submitted = false;
        removeHighlights();
        studentInput.value = '';
    }
    function renderAnswerKey() {
        let html = '';
        questions.forEach((q, i) => { html += `<div class="answer-item"><span class="answer-q">${i+1}.</span> 正确答案：${q.correct}<br><span style="color:#4a6b5c;">📖 ${q.explanation}</span></div>`; });
        answerGrid.innerHTML = html;
    }
    render(); renderAnswerKey();
    document.getElementById('submitBtn').onclick = () => { if (!studentInput.value || studentInput.value < 1 || studentInput.value > 50) alert('请填写正确的学号 (1-50)'); else { let missing = []; for (let i = 0; i < 20; i++) if (!answers[i]) missing.push(i+1); if (missing.length && !confirm(`第 ${missing.join(',')} 题未选，确定提交吗？`)) return; showResult(); } };
    document.getElementById('resetBtn').onclick = reset;
</script>
</body>
</html>
